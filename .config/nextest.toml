# nextest runs every test at once across the binaries (.github/workflows/test.yml). A test that MEASURES the machine (the CPU time an idle seat uses) cannot share it: it takes every slot, so nothing else runs
# while it does. Only tests that measure CPU time belong here; tests with a wall-clock bound have so far passed alongside the rest.
[[profile.default.overrides]]
filter = 'binary(idle_churn_1143)'
threads-required = 'num-cpus'

# THE STANDALONE PROFILE (CI of this repository, until the move from babyseat is finished: README.md, steps 3 and 4). The test binaries below start the real seat on babyseat's packs and apps
# (`membrane/packs`, `membrane/apps/barest.c1f`, read through `../membrane`), which are not in this repository: they stay with babyseat and run there against a pinned cliffvm. Every other test runs here.
[profile.standalone]
default-filter = 'not binary(/^(admin_1143|admin_token_1143|banner_1143|boot_plan|boot_routes_1143|born_by_chain_1143|bridge_e2e_1143|chat_abort_1143|chat_interrupted_1143|chat_keys_1143|chat_openai_1143|chat_process|classlist_1143|cliffvm_process|command_stdin_1143|contracts|cron_1143|dist_1143|door_auth_1143|door_bad_json_1143|door_decisions_sql|door_serve_prefix_1143|door_static|door_voice|edit_pack|embed_1143|embed_process_1143|entityrecall_1143|environment_host_1143|environment_process_1143|error_class_1143|eval_stats_host_1143|field_1143|field_active_1143|finished_guard_1143|footguns_1143|footguns_door_1143|gc_1143|ha_1143|help_1143|host_loop|idle_churn_1143|layer_answer_1143|lazy_boot_1143|legacy_cutover_1143|legacy_import_1143|legacy_name_1143|legacy_routes_1143|levels_order_1143|link_slice1_1143|link_slice2_1143|memory_1143|models_door|movelog_1143|neutral_text_1143|no_real_ollama_1143|no_wire_1143|ollama_default_1143|pack_entities|page_identity_1143|peers_1143|peers_auth_1143|peers_super_1143|plumbing_1143|recall_banner_1143|recall_scale_1143|related_perf_1143|release_verify_1143|resolution_1143|seat_launcher_1143|seat_model_1143|seat_process|semrecall_1143|semtext_1143|semtext_process_1143|serve_1143|session_1143|session_events_1143|settings_1143|settings_models_1143|sql_door_1143|sql_driver_1143|status_work_1143|storage_1143|store_driver|text_1143|unload_process_1143|vector_1143|vote_1143)$/)'

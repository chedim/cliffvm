[package]
name = "cliffvm"
version = "0.7.62"
edition = "2021"
description = "The cliffhanger VM: a reactive graph of entities with getters and setters, a SQLite store, an HTTP door and drivers; the engine of babyseat"
license = "MIT"
repository = "https://github.com/chedim/cliffvm"
readme = "README.md"
keywords = ["graph", "vm", "reactive", "agents"]
categories = ["development-tools"]

# the library keeps its old name: babyseat's Python extension and its tests say `membrane_vm`; it is renamed when babyseat takes cliffvm as a dependency (the plan in README.md)
[lib]
name = "membrane_vm"
crate-type = ["cdylib", "rlib"]

# THE ONE PLACE THE COMMAND'S NAME LIVES (docs/cliffvm.md): rename the app by changing `name` here (the tests read CARGO_BIN_EXE_<name>: one more line each)
[[bin]]
name = "cliffvm"
path = "src/bin/cliffvm.rs"
required-features = ["bin"]

[[bin]]
name = "graphlink-bridge"
path = "src/bin/graphlink-bridge.rs"
required-features = ["bridge"]

[dependencies]
bytemuck = { version = "1.25.2", optional = true }
pollster = { version = "1.0.1", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
# the graph link's protocol, tokens, shared memory and bridge (#1143): github.com/chedim/graphlink, from crates.io
graphlink-core = { version = "0.1.1" }
graphlink-auth = { version = "0.1.1" }
# shared memory for the seat's local peers (Unix; an empty crate elsewhere): control rings and cell tables (docs/graph-link.md, section 18)
graphlink-bridge = { version = "0.1.1", optional = true }
graphlink-shm = { version = "0.1.1", optional = true }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }   # a stored f64 (a stamp, a number in a journal line) must parse back to the same bits (#1143)
# the tokenizer (#1143): UAX #29 sentence and word boundaries, compiled in; no_std-capable, so wasm32 builds
unicode-segmentation = { version = "=1.13.3", default-features = false }
# the field store (#1111): the process's one SQLite, owned by the native engine
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
wgpu = { version = "30.0.1", optional = true }
objc2 = { version = "0.6.5", optional = true }
objc2-foundation = { version = "0.3.2", optional = true, default-features = false, features = ["std", "NSString", "NSError"] }
objc2-metal = { version = "0.3.2", optional = true, default-features = false, features = ["std", "block2", "MTLAllocation", "MTLBuffer", "MTLCommandBuffer", "MTLCommandEncoder", "MTLCommandQueue", "MTLComputeCommandEncoder", "MTLComputePipeline", "MTLDevice", "MTLLibrary", "MTLResource", "MTLTypes"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
webpki-roots = { version = "1", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3

[features]
default = ["bin"]   # `cargo build` / `cargo test` build the seat; the browser build is `--no-default-features --features wasm` (build-web.sh)
store = ["dep:rusqlite", "tls", "dep:graphlink-shm"]   # the native field store + the drivers + the door (one SQLite per process, #1111)
bin = ["store", "bridge"]   # the standalone app (`[[bin]]` below)
bridge = ["dep:graphlink-bridge"]   # the `graphlink-bridge` program (TCP outward, shared memory inward), shipped with the seat: see src/bin/graphlink-bridge.rs
wasm = ["dep:wasm-bindgen"]
metal = ["dep:wgpu", "dep:pollster", "dep:bytemuck", "dep:objc2", "dep:objc2-foundation", "dep:objc2-metal"]
phase-trace = []   # a diagnostic, OFF by default: src/trace.rs counts the engine's phases (remove, link_round, drain_apply, ...) and a thread prints one line to stderr every 2 s
alloc-stats = []   # a diagnostic, OFF by default: the counting global allocator (src/alloc_stats.rs) in the standalone app, one line to stderr per second
tls = ["dep:rustls", "dep:webpki-roots"]   # https for the Fetch driver (rustls + webpki roots); off for wasm

[dev-dependencies]
graphlink-net = { version = "0.1.1" }
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
# the Rust tests' own executor (a test binary is its own process: it never shares a WAL file with the seat)
rusqlite = { version = "0.32", features = ["bundled"] }

name: test

on:
  push:
  pull_request:

jobs:
  cargo:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5   # some tests use a system python3 as a fake `claude` and an http.server
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # nextest runs every test as its own process, all at once. The tests that need babyseat's packs are in tests/babyseat/, which cargo does not build (tests/babyseat/README.md)
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --release --no-default-features --features bin --no-fail-fast
      - run: cargo test --release --no-default-features --features bin --doc
      # tests written in c1f (tests/c1ft/, github.com/chedim/c1ft): the runner is built against THIS checkout, so they run on the engine under test
      - name: c1ft
        run: |
          # c1ft's own Cargo.lock pins the published cliffvm, and cargo then leaves this checkout unused when its version is ahead of the lock (a release bump: "patch cliffvm v0.4.2 was not used in the crate graph"),
          # so the tests ran on the OLD engine. Without the lock the patch is always taken.
          git clone --depth 1 https://github.com/chedim/c1ft "$RUNNER_TEMP/c1ft"
          rm -f "$RUNNER_TEMP/c1ft/Cargo.lock"
          cargo install --path "$RUNNER_TEMP/c1ft" --force --config "patch.crates-io.cliffvm.path=\"$GITHUB_WORKSPACE\""
          c1ft run tests/c1ft
